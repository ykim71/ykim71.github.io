<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Who sets the affective register of political information?</title>
  <desc id="desc">Partisans, platforms, and AI models shape the affective register, influencing attention, sharing, and polarization across language, images, and networks.</desc>
  <style>
    .paper{fill:#f7f5ef}.ink{fill:#16272d}.muted{fill:#667176}.rust{fill:#a23b2a}.teal{fill:#1f6867}.line{fill:none;stroke:#c8c5bb;stroke-width:1.5}.accent-line{fill:none;stroke:#1f6867;stroke-width:2}.eyebrow,.source,.outcome{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:2px}.eyebrow{font-size:13px;font-weight:700}.source{font-size:15px;font-weight:700}.register{font-family:Georgia,serif;font-size:41px;font-style:italic}.outcome{font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){.paper{fill:#172428}.ink{fill:#eef2ed}.muted{fill:#abb6b7}.rust{fill:#dc7868}.teal{fill:#6eb3af}.line{stroke:#526166}.accent-line{stroke:#6eb3af}}
  </style>
  <rect class="paper" x="1" y="1" width="698" height="418"/>

  <text class="eyebrow muted" x="350" y="39" text-anchor="middle">WHO SETS THE TONE?</text>

  <circle class="rust" cx="122" cy="108" r="5"/>
  <text class="source ink" x="122" y="139" text-anchor="middle">PARTISANS</text>

  <circle class="teal" cx="350" cy="108" r="5"/>
  <text class="source ink" x="350" y="139" text-anchor="middle">PLATFORMS</text>

  <circle class="ink" cx="578" cy="108" r="5"/>
  <text class="source ink" x="578" y="139" text-anchor="middle">AI MODELS</text>

  <path class="line" d="M122 162V185H578V162"/>
  <path class="line" d="M350 185V217"/>
  <circle class="teal" cx="350" cy="217" r="3.5"/>

  <text class="register rust" x="350" y="277" text-anchor="middle">affective register</text>
  <path class="accent-line" d="M262 295H438"/>
  <path class="line" d="M350 295V333"/>

  <text class="outcome muted" x="350" y="371" text-anchor="middle">ATTENTION · SHARING · POLARIZATION</text>
  <text class="eyebrow muted" x="350" y="405" text-anchor="middle">ACROSS LANGUAGE, IMAGES, AND NETWORKS</text>
</svg>
