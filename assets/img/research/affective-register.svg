<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
  <title id="title">The affective register of political information</title>
  <desc id="desc">Partisans, platforms, and AI models converge to shape the affective register, influencing attention, sharing, and polarization.</desc>
  <style>
    .paper{fill:#ebe7dc}.ink{fill:#16272d}.rust{fill:#a23b2a}.teal{fill:#1f6867}.line{fill:none;stroke:#16272d;stroke-width:2}.dash{fill:none;stroke:#1f6867;stroke-width:2;stroke-dasharray:5 7}.label{font:700 15px Arial,sans-serif;letter-spacing:1.8px}.small{font:600 12px Arial,sans-serif;letter-spacing:1.1px}.serif{font:600 30px Georgia,serif}.muted{fill:#56656a}
    @media (prefers-color-scheme:dark){.paper{fill:#1d2a2d}.ink{fill:#edf0ec}.rust{fill:#ef8f78}.teal{fill:#70b8b3}.line{stroke:#edf0ec}.dash{stroke:#70b8b3}.muted{fill:#aab6b6}}
  </style>
  <rect class="paper" x="1" y="1" width="518" height="618"/>
  <text class="small muted" x="36" y="45">SOURCES OF POLITICAL TONE</text>
  <circle class="rust" cx="78" cy="118" r="12"/>
  <text class="label ink" x="108" y="124">PARTISANS</text>
  <circle class="teal" cx="78" cy="184" r="12"/>
  <text class="label ink" x="108" y="190">PLATFORMS</text>
  <circle class="ink" cx="78" cy="250" r="12"/>
  <text class="label ink" x="108" y="256">AI MODELS</text>
  <path class="line" d="M90 118 C195 118 190 304 250 304"/>
  <path class="line" d="M90 184 C185 184 190 304 250 304"/>
  <path class="line" d="M90 250 C175 250 190 304 250 304"/>
  <circle class="paper" cx="304" cy="304" r="95" stroke="#a23b2a" stroke-width="3"/>
  <circle class="dash" cx="304" cy="304" r="76"/>
  <text class="small rust" x="304" y="275" text-anchor="middle">THE</text>
  <text class="serif ink" x="304" y="311" text-anchor="middle">affective</text>
  <text class="serif ink" x="304" y="345" text-anchor="middle">register</text>
  <path class="line" d="M304 399 L304 453"/>
  <path class="line" d="M304 453 L185 507"/>
  <path class="line" d="M304 453 L304 507"/>
  <path class="line" d="M304 453 L423 507"/>
  <circle class="rust" cx="185" cy="515" r="6"/>
  <circle class="teal" cx="304" cy="515" r="6"/>
  <circle class="ink" cx="423" cy="515" r="6"/>
  <text class="small ink" x="185" y="551" text-anchor="middle">ATTENTION</text>
  <text class="small ink" x="304" y="551" text-anchor="middle">SHARING</text>
  <text class="small ink" x="423" y="551" text-anchor="middle">POLARIZATION</text>
  <text class="small muted" x="36" y="592">LANGUAGE · IMAGES · NETWORKS</text>
</svg>
